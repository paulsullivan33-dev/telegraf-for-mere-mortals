# Lab config 1: this machine's own vital signs, written to a file.
# Run Telegraf from the telegraf-lab/ folder; all paths are
# relative to it.
[agent]
  interval = "2s"
  flush_interval = "2s"
  round_interval = false
  hostname = "boardwalk-01"
  omit_hostname = false

[global_tags]
  project = "noticeboard"
  site = "pier-a"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.system]]

[[outputs.file]]
  files = ["outputs/system.lp"]
  data_format = "influx"
