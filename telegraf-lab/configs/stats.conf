# Lab config 4: the HTTP listener again, but every point passes
# through the basicstats aggregator and the original is dropped.
[agent]
  interval = "1s"
  flush_interval = "1s"
  round_interval = false
  hostname = "boardwalk-01"
  omit_hostname = false

[[inputs.http_listener_v2]]
  service_address = "127.0.0.1:18083"
  paths = ["/telegraf"]
  data_format = "influx"

[[aggregators.basicstats]]
  period = "5s"
  drop_original = true
  stats = ["count", "min", "max", "mean"]

[[outputs.file]]
  files = ["outputs/stats.lp"]
  data_format = "influx"
