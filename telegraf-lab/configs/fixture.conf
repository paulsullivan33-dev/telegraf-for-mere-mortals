# Lab config 2: fictional noticeboard sensor readings from a
# JSON fixture, with one field renamed by a processor.
[agent]
  interval = "2s"
  flush_interval = "2s"
  round_interval = false
  hostname = "boardwalk-01"
  omit_hostname = false

[[inputs.file]]
  files = ["fixtures/readings.json"]
  data_format = "json"
  tag_keys = ["sensor", "room"]
  name_override = "noticeboard_reading"

[[processors.rename]]
  [[processors.rename.replace]]
    field = "temperature_c"
    dest = "temp_c"

[[outputs.file]]
  files = ["outputs/fixture.lp"]
  data_format = "influx"
