# Lab config 5: gather every second, flush every three. The gap
# between the two numbers is the buffer, made visible.
[agent]
  interval = "1s"
  flush_interval = "3s"
  round_interval = false
  hostname = "boardwalk-01"
  omit_hostname = false

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[outputs.file]]
  files = ["outputs/flush.lp"]
  data_format = "influx"
