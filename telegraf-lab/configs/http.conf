# Lab config 3: listen for line protocol on loopback and write
# what arrives to a file.
[agent]
  interval = "1s"
  flush_interval = "1s"
  round_interval = false
  hostname = "boardwalk-01"
  omit_hostname = false

[[inputs.http_listener_v2]]
  service_address = "127.0.0.1:18083"
  paths = ["/telegraf"]
  data_format = "influx"

[[outputs.file]]
  files = ["outputs/http.lp"]
  data_format = "influx"
